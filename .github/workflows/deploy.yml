# Deploys a version tag (such as 0.1.0) to the wordpress.org plugin SVN repository.
# Needs the SVN_USERNAME and SVN_PASSWORD repository secrets; .distignore decides what ships.
name: Deploy to wordpress.org

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy tag to SVN
    runs-on: ubuntu-latest
    # Off until the founder sets the ENABLE_WPORG_DEPLOY repository variable to "true".
    if: vars.ENABLE_WPORG_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        if: github.ref_type == 'tag'
        run: |
          plugin_version="$(sed -n 's/^ \* Version: *//p' simpledatalogs.php)"
          stable_tag="$(sed -n 's/^Stable tag: *//p' readme.txt)"
          test "$plugin_version" = "$GITHUB_REF_NAME"
          test "$stable_tag" = "$GITHUB_REF_NAME"

      - name: Deploy to wordpress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: simpledatalogs
